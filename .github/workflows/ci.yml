name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Skip installing Git hooks on the CI machine
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      # Type checks every project (tsc -b) before bundling
      - run: npm run build
      - run: npm test
